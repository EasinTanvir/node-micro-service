apiVersion: skaffold/v4beta6
kind: Config

metadata:
  name: auth-service

build:
  local:
    push: false

  artifacts:
    - image: auth-service
      context: authService

      docker:
        dockerfile: Dockerfile

      sync:
        manual:
          - src: "**/*.js"
            dest: .

    - image: client-service
      context: client

      docker:
        dockerfile: Dockerfile

      sync:
        manual:
          - src: "**/*.js"
            dest: .

    - image: ticket-service
      context: tickets

      docker:
        dockerfile: Dockerfile

      sync:
        manual:
          - src: "**/*.js"
            dest: .

    - image: order-service
      context: orders

      docker:
        dockerfile: Dockerfile

      sync:
        manual:
          - src: "**/*.js"
            dest: .

manifests:
  rawYaml:
    - ./infra/k8s/*
